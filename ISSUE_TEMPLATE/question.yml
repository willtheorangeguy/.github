name: Question
description: Ask about how to use this project.
title: "[Question]: "
labels: ["question"]
assignees: ["willtheorangeguy"]
body:
  - type: markdown
    attributes:
      value: |
        If this repository has **Discussions** enabled, that is usually the better place to ask — it keeps the issue tracker focused on bugs and features.

  - type: checkboxes
    id: search
    attributes:
      label: Preflight
      options:
        - label: I checked the README and the `docs/` folder, and searched the existing issues.
          required: true

  - type: textarea
    id: question
    attributes:
      label: What is your question?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: What are you trying to do?
      description: Describing the goal behind the question often gets you a better answer.

  - type: input
    id: version
    attributes:
      label: Version
      description: Which version of the project are you running, if relevant?
      placeholder: "1.2.3, or a commit SHA"
